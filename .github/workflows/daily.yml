name: Daily Antwerpen Update

on:
  workflow_dispatch:
    inputs:
      editie:
        description: "Welke editie versturen?"
        required: false
        default: ochtend
        type: choice
        options:
          - ochtend
          - avond

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verstuur update naar Telegram (ochtend)
        if: inputs.editie == 'ochtend'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MULTI_CHAT_IDS: ${{ secrets.MULTI_CHAT_IDS }}
        run: python antwerpen_bot.py ochtend

      - name: Verstuur update naar Telegram (avond)
        if: inputs.editie == 'avond'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MULTI_CHAT_IDS: ${{ secrets.MULTI_CHAT_IDS }}
        run: python antwerpen_bot.py avond

      - name: Telegram-melding bij falen
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="35520211" \
            -d text="⚠️ Antwerpen-bot: de dagelijkse update is MISLUKT. Check de logs op GitHub."
