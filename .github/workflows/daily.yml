name: Daily Antwerpen Update

on:
  schedule:
    - cron: "2 7 * * *"    # 08:00 CET (na 26 okt) — nu tot 26 okt: 09:00
    - cron: "2 17 * * *"   # 18:00 CET (na 26 okt) — nu tot 26 okt: 19:00
  workflow_dispatch:
    inputs:
      editie:
        description: "Welke editie versturen?"
        required: false
        default: ochtend
        type: choice
        options:
          - ochtend
          - avond

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verstuur update naar Telegram (ochtend)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.editie == 'ochtend') || (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MULTI_CHAT_IDS: ${{ secrets.MULTI_CHAT_IDS }}
        run: python antwerpen_bot.py ochtend

      - name: Verstuur update naar Telegram (avond)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.editie == 'avond') || (github.event_name == 'schedule' && github.event.schedule == '0 17 * * *') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MULTI_CHAT_IDS: ${{ secrets.MULTI_CHAT_IDS }}
        run: python antwerpen_bot.py avond

      - name: Telegram-melding bij falen
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="35520211" \
            -d text="⚠️ Antwerpen-bot: de dagelijkse update is MISLUKT. Check de logs op GitHub."
