name: Daily Antwerpen Update

on:
  schedule:
    - cron: "0 7 * * *"    # elke dag 08:00 NL — ochtendeditie
    - cron: "0 17 * * *"   # elke dag 18:00 NL — avondeditie
  workflow_dispatch: {}

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verstuur update naar Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python antwerpen_bot.py
