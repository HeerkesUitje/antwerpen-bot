name: Daily Antwerpen Update

on:
  schedule:
    - cron: "0 6 * * *"    # 08:00 CET / 09:00 CEST (ochtend)
    - cron: "0 16 * * *"   # 18:00 CET / 19:00 CEST (avond)
  workflow_dispatch: {}

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verstuur update naar Telegram (ochtend)
        if: ${{ github.event.schedule == '0 6 * * *' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python antwerpen_bot.py ochtend

      - name: Verstuur update naar Telegram (avond)
        if: ${{ github.event.schedule != '0 6 * * *' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python antwerpen_bot.py avond
