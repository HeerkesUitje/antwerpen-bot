name: Antwerpen Bot Luisteraar

on:
  schedule:
    - cron: "*/5 * * * *"   # elke 5 minuten
  workflow_dispatch: {}

concurrency:
  group: listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Luister naar commando's
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python listen.py
      - name: Telegram-melding bij falen
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="35520211" \
            -d text="⚠️ Antwerpen-bot: de LUISTERAAR is gecrasht. Check de logs op GitHub."
